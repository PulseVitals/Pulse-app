<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE - Event Prediction Market</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #020617; color: #f8fafc; font-family: system-ui, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 pb-16">

  <!-- Header -->
  <header class="w-full max-w-md flex justify-between items-center py-4 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <div class="bg-emerald-400 text-slate-950 font-black p-2 rounded-xl text-xl">⚡</div>
      <span class="font-black text-2xl tracking-tight text-white">PULSE</span>
    </div>
    <div class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl flex items-center gap-2">
      <span class="text-xs text-slate-400">Balance</span>
      <span id="balance" class="text-sm font-bold text-emerald-400">$250.00</span>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <div class="w-full max-w-md mt-4 grid grid-cols-2 bg-slate-900 p-1 rounded-2xl border border-slate-800">
    <button id="tab-markets" onclick="switchView('markets')" class="py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-950 transition-all">🔥 Markets</button>
    <button id="tab-leaderboard" onclick="switchView('leaderboard')" class="py-2 rounded-xl text-xs font-bold text-slate-400 transition-all">🏆 Leaderboard</button>
  </div>

  <!-- MARKETS VIEW -->
  <div id="view-markets" class="w-full max-w-md flex flex-col gap-4 mt-4">
    <div id="market-feed" class="flex flex-col gap-4"></div>
  </div>

  <!-- LEADERBOARD VIEW -->
  <div id="view-leaderboard" class="w-full max-w-md hidden flex-col gap-3 mt-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-4 shadow-xl">
      <h3 class="text-sm font-bold text-emerald-400 mb-3 flex items-center gap-2">🏆 Top Predictors This Week</h3>
      <div class="flex flex-col gap-2.5">
        <div class="flex justify-between items-center bg-slate-950 p-3 rounded-2xl border border-slate-800 text-xs">
          <div class="flex items-center gap-3">
            <span class="font-black text-amber-400 text-sm">#1</span>
            <div>
              <div class="font-bold text-slate-100">@SatoshiN</div>
              <div class="text-[10px] text-slate-500">14 Win Streak</div>
            </div>
          </div>
          <span class="font-bold text-emerald-400">+$12,450</span>
        </div>
        <div class="flex justify-between items-center bg-slate-950 p-3 rounded-2xl border border-slate-800 text-xs">
          <div class="flex items-center gap-3">
            <span class="font-black text-slate-300 text-sm">#2</span>
            <div>
              <div class="font-bold text-slate-100">@AlexTech</div>
              <div class="text-[10px] text-slate-500">9 Win Streak</div>
            </div>
          </div>
          <span class="font-bold text-emerald-400">+$8,120</span>
        </div>
        <div class="flex justify-between items-center bg-slate-950 p-3 rounded-2xl border border-slate-800 text-xs">
          <div class="flex items-center gap-3">
            <span class="font-black text-amber-600 text-sm">#3</span>
            <div>
              <div class="font-bold text-slate-100">@CryptoQueen</div>
              <div class="text-[10px] text-slate-500">7 Win Streak</div>
            </div>
          </div>
          <span class="font-bold text-emerald-400">+$5,890</span>
        </div>
      </div>
    </div>
  </div>

  <!-- COMMENTS MODAL -->
  <div id="comment-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 flex flex-col gap-4 shadow-2xl max-h-[80vh]">
      <div class="flex justify-between items-center">
        <h3 id="modal-title" class="font-bold text-sm text-slate-200 truncate pr-4">Market Discussion</h3>
        <button onclick="closeComments()" class="text-slate-400 text-sm font-bold bg-slate-800 px-2.5 py-1 rounded-full">✕</button>
      </div>

      <!-- Comment List -->
      <div id="comment-list" class="flex flex-col gap-2 overflow-y-auto max-h-60 text-xs pr-1"></div>

      <!-- Comment Input -->
      <div class="flex gap-2 pt-2 border-t border-slate-800">
        <input id="comment-input" type="text" placeholder="Share your take..." class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white w-full focus:outline-none focus:border-emerald-500" />
        <button onclick="addComment()" class="bg-emerald-500 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs">Post</button>
      </div>
    </div>
  </div>

  <script>
    let userBalance = 250.00;
    let activeMarketId = null;

    const markets = [
      { 
        id: 1, 
        category: 'Tech', 
        title: 'GPT-5 released before December 2026?', 
        yes: 68, 
        no: 32, 
        vol: '$1.4M',
        comments: [
          { user: '@SamA', text: 'Training run is almost done, easily yes.' },
          { user: '@TechGuy', text: 'Safety evals will delay it to 2027 IMO.' }
        ]
      },
      { 
        id: 2, 
        category: 'Finance', 
        title: 'Bitcoin breaks $120,000 in 2026?', 
        yes: 42, 
        no: 58, 
        vol: '$3.8M',
        comments: [
          { user: '@Whale99', text: 'Institutional inflows are crazy right now.' }
        ]
      },
      { 
        id: 3, 
        category: 'Entertainment', 
        title: 'Marvel Avengers Doomsday hits $2B Box Office?', 
        yes: 55, 
        no: 45, 
        vol: '$890K',
        comments: [
          { user: '@Cinephile', text: 'Robert Downey Jr return guarantees opening weekend hype.' }
        ]
      }
    ];

    function renderMarkets() {
      const feed = document.getElementById('market-feed');
      feed.innerHTML = '';

      markets.forEach(m => {
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl flex flex-col gap-4";
        card.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="bg-emerald-500/10 text-emerald-400 text-[10px] font-bold px-2.5 py-1 rounded-full border border-emerald-500/20">${m.category.toUpperCase()}</span>
            <span class="text-xs text-slate-500">Vol: ${m.vol}</span>
          </div>

          <h2 class="text-lg font-bold text-white leading-snug">${m.title}</h2>

          <div class="flex flex-col gap-1.5">
            <div class="flex justify-between text-xs font-bold">
              <span class="text-emerald-400">YES ${m.yes}¢ (${m.yes}%)</span>
              <span class="text-rose-400">(${m.no}%) NO ${m.no}¢</span>
            </div>
            <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden flex">
              <div class="bg-emerald-500 h-full" style="width: ${m.yes}%"></div>
              <div class="bg-rose-500 h-full" style="width: ${m.no}%"></div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 mt-1">
            <button onclick="placeBet('${m.title}', 'YES', ${m.yes / 100})" class="bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 font-bold py-3 rounded-xl text-xs text-center">
              BET YES (${m.yes}¢)
            </button>
            <button onclick="placeBet('${m.title}', 'NO', ${m.no / 100})" class="bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-400 font-bold py-3 rounded-xl text-xs text-center">
              BET NO (${m.no}¢)
            </button>
          </div>

          <div class="pt-2 border-t border-slate-800/80 flex justify-between items-center text-xs text-slate-400">
            <button onclick="openComments(${m.id})" class="text-slate-400 hover:text-emerald-400 font-semibold flex items-center gap-1">
              💬 ${m.comments.length} Discussion
            </button>
          </div>
        `;
        feed.appendChild(card);
      });
    }

    function placeBet(title, side, price) {
      if (userBalance < 10) return alert("Insufficient funds!");
      userBalance -= 10;
      document.getElementById('balance').innerText = '$' + userBalance.toFixed(2);
      alert(`Placed $10 bet on ${side} for: ${title}`);
    }

    function switchView(view) {
      document.getElementById('view-markets').classList.toggle('hidden', view !== 'markets');
      document.getElementById('view-leaderboard').classList.toggle('hidden', view !== 'leaderboard');
      
      document.getElementById('tab-markets').className = view === 'markets' ? 'py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-950 transition-all' : 'py-2 rounded-xl text-xs font-bold text-slate-400 transition-all';
      document.getElementById('tab-leaderboard').className = view === 'leaderboard' ? 'py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-950 transition-all' : 'py-2 rounded-xl text-xs font-bold text-slate-400 transition-all';
    }

    function openComments(id) {
      activeMarketId = id;
      const m = markets.find(x => x.id === id);
      document.getElementById('modal-title').innerText = m.title;
      renderComments();
      document.getElementById('comment-modal').classList.remove('hidden');
      document.getElementById('comment-modal').classList.add('flex');
    }

    function closeComments() {
      document.getElementById('comment-modal').classList.add('hidden');
      document.getElementById('comment-modal').classList.remove('flex');
    }

    function renderComments() {
      const m = markets.find(x => x.id === activeMarketId);
      const list = document.getElementById('comment-list');
      list.innerHTML = '';
      m.comments.forEach(c => {
        const div = document.createElement('div');
        div.className = "bg-slate-950 p-2.5 rounded-xl border border-slate-800";
        div.innerHTML = `<span class="font-bold text-emerald-400">${c.user}:</span> <span class="text-slate-300">${c.text}</span>`;
        list.appendChild(div);
      });
    }

    function addComment() {
      const input = document.getElementById('comment-input');
      if (!input.value.trim()) return;
      const m = markets.find(x => x.id === activeMarketId);
      m.comments.push({ user: '@You', text: input.value.trim() });
      input.value = '';
      renderComments();
      renderMarkets();
    }

    renderMarkets();
  </script>
</body>
</html>
