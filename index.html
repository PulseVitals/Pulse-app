<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE - Event Prediction Market</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #020617; color: #f8fafc; font-family: system-ui, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 pb-12">

  <!-- Header -->
  <header class="w-full max-w-md flex justify-between items-center py-4 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <div class="bg-emerald-400 text-slate-950 font-black p-2 rounded-xl text-xl">⚡</div>
      <span class="font-black text-2xl tracking-tight text-white">PULSE</span>
    </div>
    <div class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl flex items-center gap-2">
      <span class="text-xs text-slate-400">Balance</span>
      <span id="balance" class="text-sm font-bold text-emerald-400">$250.00</span>
    </div>
  </header>

  <!-- Categories Bar -->
  <div class="w-full max-w-md mt-4 flex gap-2 overflow-x-auto no-scrollbar py-1">
    <button onclick="filterCategory('All')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold bg-white text-slate-950">All</button>
    <button onclick="filterCategory('Tech')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-slate-400 border border-slate-800">Tech</button>
    <button onclick="filterCategory('Finance')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-slate-400 border border-slate-800">Finance</button>
    <button onclick="filterCategory('Culture')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-slate-400 border border-slate-800">Culture</button>
  </div>

  <!-- Main Feed Container -->
  <main id="market-feed" class="w-full max-w-md mt-4 flex flex-col gap-4">
    <!-- Cards render dynamically via JavaScript -->
  </main>

  <!-- Active Trades Log -->
  <div class="w-full max-w-md mt-6 bg-slate-900/50 border border-slate-800 rounded-2xl p-4 text-xs text-slate-400">
    <span class="font-bold text-slate-200">Active Positions:</span>
    <div id="log-items" class="mt-2 flex flex-col gap-2">
      <span class="text-slate-500 italic">No open trades yet. Tap YES or NO above!</span>
    </div>
  </div>

  <script>
    let userBalance = 250.00;

    const markets = [
      { id: 1, category: 'Tech', title: 'GPT-5 released before December 2026?', yes: 68, no: 32, vol: '$1.4M' },
      { id: 2, category: 'Finance', title: 'Bitcoin breaks $120,000 in 2026?', yes: 42, no: 58, vol: '$3.8M' },
      { id: 3, category: 'Culture', title: 'New Marvel movie breaks $1B opening weekend?', yes: 24, no: 76, vol: '$420K' },
      { id: 4, category: 'Tech', title: 'Starship reaches orbit on next test flight?', yes: 85, no: 15, vol: '$890K' }
    ];

    function renderMarkets(filter = 'All') {
      const feed = document.getElementById('market-feed');
      feed.innerHTML = '';

      const filtered = filter === 'All' ? markets : markets.filter(m => m.category === filter);

      filtered.forEach(m => {
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl flex flex-col gap-4";
        card.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="bg-emerald-500/10 text-emerald-400 text-[10px] font-bold px-2.5 py-1 rounded-full border border-emerald-500/20">${m.category.toUpperCase()}</span>
            <span class="text-xs text-slate-500">Vol: ${m.vol}</span>
          </div>

          <h2 class="text-lg font-bold text-white leading-snug">${m.title}</h2>

          <div class="flex flex-col gap-1.5">
            <div class="flex justify-between text-xs font-bold">
              <span class="text-emerald-400">YES ${m.yes}¢ (${m.yes}%)</span>
              <span class="text-rose-400">(${m.no}%) NO ${m.no}¢</span>
            </div>
            <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden flex">
              <div class="bg-emerald-500 h-full" style="width: ${m.yes}%"></div>
              <div class="bg-rose-500 h-full" style="width: ${m.no}%"></div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 mt-1">
            <button onclick="placeBet('${m.title}', 'YES', ${m.yes / 100})" class="bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 font-bold py-3 rounded-xl transition-all active:scale-95 text-xs text-center">
              BET YES (${m.yes}¢)
            </button>
            <button onclick="placeBet('${m.title}', 'NO', ${m.no / 100})" class="bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-400 font-bold py-3 rounded-xl transition-all active:scale-95 text-xs text-center">
              BET NO (${m.no}¢)
            </button>
          </div>
        `;
        feed.appendChild(card);
      });
    }

    function placeBet(title, side, price) {
      if (userBalance < 10) return alert("Insufficient funds!");
      userBalance -= 10;
      document.getElementById('balance').innerText = '$' + userBalance.toFixed(2);
      
      const potentialPayout = (10 / price).toFixed(2);
      const logItems = document.getElementById('log-items');
      
      if (logItems.children[0]?.tagName === 'SPAN') logItems.innerHTML = '';

      const item = document.createElement('div');
      item.className = "flex justify-between bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-xs";
      item.innerHTML = `
        <div class="flex flex-col gap-0.5">
          <span class="font-bold text-slate-200 truncate max-w-[200px]">${title}</span>
          <span class="${side === 'YES' ? 'text-emerald-400' : 'text-rose-400'} font-bold">${side} ($10 Wager)</span>
        </div>
        <span class="text-emerald-400 font-bold self-center">Payout: $${potentialPayout}</span>
      `;
      logItems.prepend(item);
    }

    function filterCategory(cat) {
      renderMarkets(cat);
    }

    // Initial render
    renderMarkets();
  </script>
</body>
</html>
